lesson:
  title: "课程导论与语音AI全景"
  chapter_title: "课程导入与人工智能概述"
  week_no: 1
  hours: 4

  # 二、学情分析（200-300字左右）
  student_analysis: >
    学生已具备一定的计算机与编程基础，能够理解“输入—处理—输出”的系统思维，但对语音信号的连续特性、
    采样率/量化等概念，以及语音AI从数据采集到模型部署的完整流水线缺乏整体认知。部分同学对ASR/TTS等应用
    有直观体验但停留在“产品使用层”，对背后关键模块（预处理、特征、模型、评估指标、部署形态）理解不足。
    本周将以真实应用场景串联关键概念，降低抽象门槛，并通过小组任务拆解让学生形成“流水线视角”，为后续
    语音特征、模型训练与工程实践打下基础。

  # 三、教学内容分析
  content_analysis:
    basic: "介绍课程整体安排与目标；建立语音AI任务全景：ASR、TTS、说话人识别/验证、情感识别等；讲解最小语音AI流水线：采集→预处理→特征→模型→评估→部署，并以产品案例贯穿说明。"
    key_points: "ASR/TTS等核心任务的概念与应用场景；语音AI流水线各环节的作用与输入输出；评估指标的直观含义（如WER/MOS）。"
    difficult_points: "采样率/特征/模型/指标之间的对应关系；如何把真实需求拆解成可实现的流水线模块，并明确每个模块的输入输出。"

  # 四、教学目标（四类目标）
  objectives:
    value: "帮助学生理解语音AI对学习与社会发展的影响，激发探索兴趣与责任意识。"
    knowledge: "掌握ASR/TTS等基础概念与典型应用场景；理解语音AI流水线的关键环节与基本指标含义。"
    ability: "能够将一个语音需求拆解为“输入→处理→输出”的模块化流水线，并说明各模块的作用。"
    quality: "培养系统思维、问题拆解能力与团队协作表达能力，形成规范化工程意识。"

  # 五、课程教学过程设计（数组，驱动表格行）
  process:
    - step: "1"
      teach_content: "破冰与课程说明：课程目标、考核方式、资源与工具链、项目产出"
      teacher_action: "讲解课程结构与评价方式，展示学习资源与示例项目"
      student_action: "听讲、提问，明确课程要求与个人学习目标"
      method: "讲授法"
      time: "20分钟"

    - step: "2"
      teach_content: "语音AI全景：ASR/TTS/说话人/情感任务与典型产品案例"
      teacher_action: "结合真实产品演示，讲解任务定义与应用场景"
      student_action: "听讲、思考并参与讨论，归纳任务差异"
      method: "讲授法、讨论法"
      time: "30分钟"

    - step: "3"
      teach_content: "最小流水线拆解：采样率、预处理、特征、模型、评估指标（WER/MOS）"
      teacher_action: "用“流水线图”串联环节，解释每步输入输出与常见误区"
      student_action: "记录要点，完成课堂小问答，梳理关键概念"
      method: "讲授法、启发式"
      time: "30分钟"

    - step: "4"
      teach_content: "课堂练习：将一个语音需求拆成流水线（小组任务）+ 总结与作业"
      teacher_action: "布置练习、巡视指导、点评典型拆解方案并总结"
      student_action: "小组讨论并汇报：输入/输出/模块；根据反馈修正"
      method: "任务驱动、讨论法"
      time: "10分钟"

  # 六、课后作业
  homework: "阅读/预习：各找1个ASR与1个TTS应用案例并说明价值；思考：选择一个语音需求，画出“输入→处理→输出”的流水线草图（可手绘拍照或Markdown绘图）。"

  # 七、教学反思（20-30字左右）
  reflection: "案例驱动能降低抽象难度，但需控制节奏，确保每组都有输出。"

  # 八、参考资料（2-3条）
  references:
    - "《语音信号处理》相关章节：采样率、短时分析与特征提取基础"
    - "经典ASR/TTS科普文章或官方文档：了解主流应用与评估指标"
    - "开源工具文档（如Kaldi/ESPnet/Whisper/TTS项目）：快速建立工程直觉"